# =============================================================================
# File        : manifests/12-rbac-deployer.yaml
# Applied by  : cluster admin (bootstrap)
#
# Unit II 2.3.8: a continuous-deployment identity that can roll out THIS app
# in THIS namespace and nothing else -- instead of cluster-admin.
# Every object in 01-, 02- and 04- to 11- is applied AS this ServiceAccount
# (kubectl apply --as=system:serviceaccount:dso202-assignment-2:deployer),
# which proves the Role is sufficient, not just plausible.
#
# Deliberately left out:
#   - delete: the pipeline creates and updates; removing things is a human
#     decision (as in 2.3.8).
#   - roles / rolebindings / serviceaccounts: a deployer that can write RBAC
#     can grant itself anything; RBAC stays with the admin bootstrap.
#   - pods/exec, persistentvolumeclaims, nodes, other namespaces.
# "patch" IS included: kubectl apply sends PATCH for an object that already
# exists, and "update" does not cover it (the 2.3.8 incident).
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: dso202-assignment-2
  labels:
    app.kubernetes.io/part-of: tasktracker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: dso202-assignment-2
  labels:
    app.kubernetes.io/part-of: tasktracker
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Read-only access, so "kubectl rollout status" and troubleshooting work.
  - apiGroups: ["apps"]
    resources: ["replicasets", "controllerrevisions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: dso202-assignment-2
  labels:
    app.kubernetes.io/part-of: tasktracker
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: dso202-assignment-2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
