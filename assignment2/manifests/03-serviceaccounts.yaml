# =============================================================================
# File        : manifests/03-serviceaccounts.yaml
# Applied by  : cluster admin (bootstrap)
#
# Unit II 2.3.6: "Never grant permissions directly to the default Service
# Account ... create a dedicated Service Account per workload."
# None of the three tiers calls the Kubernetes API, so each gets its own
# identity with NO RoleBinding and with token automounting switched off:
# a compromised container finds no API credential to steal under
# /var/run/secrets/kubernetes.io/serviceaccount.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: dso202-assignment-2
  labels:
    app.kubernetes.io/part-of: tasktracker
    app.kubernetes.io/component: frontend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: dso202-assignment-2
  labels:
    app.kubernetes.io/part-of: tasktracker
    app.kubernetes.io/component: backend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db
  namespace: dso202-assignment-2
  labels:
    app.kubernetes.io/part-of: tasktracker
    app.kubernetes.io/component: database
automountServiceAccountToken: false
