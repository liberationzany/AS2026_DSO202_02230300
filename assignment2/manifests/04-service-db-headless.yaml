# =============================================================================
# File        : manifests/04-service-db-headless.yaml
# Applied by  : deployer ServiceAccount
#
# Unit II 2.1.6: "Always pair a StatefulSet with a headless Service dedicated
# to it." clusterIP: None means no virtual IP; DNS instead returns one A
# record per Pod and gives each Pod a stable name:
#   db-0.db-headless.dso202-assignment-2.svc.cluster.local
# The StatefulSet names it in spec.serviceName.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: db-headless
  namespace: dso202-assignment-2
  labels:
    app.kubernetes.io/name: tasktracker
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: tasktracker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: tasktracker
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
