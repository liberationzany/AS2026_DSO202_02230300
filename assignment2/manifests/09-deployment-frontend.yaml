# =============================================================================
# File        : manifests/09-deployment-frontend.yaml
# Applied by  : deployer ServiceAccount
# Watch with  : kubectl rollout status deployment/frontend -n dso202-assignment-2
#
# Changes from Assignment 1: 2 replicas behind the Ingress, readiness and
# liveness probes on the page itself, its own token-less ServiceAccount and a
# restricted security context.
# readOnlyRootFilesystem is NOT set here: docker-entrypoint.sh writes
# config.js into /usr/share/nginx/html at start, and nginx writes its temp
# files under /tmp. Making that work read-only would mean changing the image
# (emptyDir mounts over both paths), which is outside this assignment.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dso202-assignment-2
  labels:
    app.kubernetes.io/name: tasktracker
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: tasktracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tasktracker
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tasktracker
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: tasktracker
    spec:
      serviceAccountName: frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101                # "nginx" in the image
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: dso202-frontend:1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              valueFrom: {configMapKeyRef: {name: app-config, key: BACKEND_URL}}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
