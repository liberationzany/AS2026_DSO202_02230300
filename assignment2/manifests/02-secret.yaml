# =============================================================================
# File        : manifests/02-secret.yaml
# Applied by  : deployer ServiceAccount
#
# Unchanged credential contract from Assignment 1 (classroom-only values).
# DB_* keys are read by the backend, POSTGRES_* by the postgres image; each
# pair must hold the same value.
#
# The Ingress TLS Secret (tasktracker-tls) is deliberately NOT a committed
# manifest: it contains a private key. scripts/make-tls-secret.sh generates
# it at deploy time.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: dso202-assignment-2
  labels:
    app.kubernetes.io/part-of: tasktracker
    dso202/assignment: "2"
type: Opaque
stringData:
  DB_USER: taskuser
  DB_PASSWORD: taskpass
  POSTGRES_USER: taskuser       # must equal DB_USER
  POSTGRES_PASSWORD: taskpass   # must equal DB_PASSWORD
