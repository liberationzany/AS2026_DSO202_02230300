{{- /*
secret.yaml - database credentials.

Password, in order of preference:
  1. .Values.db.password, if set;
  2. the password already stored in this release's Secret ("lookup" reads
     the live cluster), so an upgrade never changes it. A changed password
     would lock the backend out: Postgres only applies POSTGRES_PASSWORD
     when it initialises an EMPTY data directory;
  3. a new random 24-character password, on first install.
"lookup" returns nothing under "helm template" (no cluster), so rendered
output shows a random value each time; that is expected.
*/}}
{{- $name := printf "%s-db-credentials" (include "tasktracker.fullname" .) -}}
{{- $password := .Values.db.password -}}
{{- if not $password -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $existing $existing.data -}}
{{- $password = index $existing.data "DB_PASSWORD" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 24 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
type: Opaque
data:
  DB_USER: {{ .Values.db.user | b64enc | quote }}
  DB_PASSWORD: {{ $password | b64enc | quote }}
  POSTGRES_USER: {{ .Values.db.user | b64enc | quote }}
  POSTGRES_PASSWORD: {{ $password | b64enc | quote }}
