{{- /*
serviceaccounts.yaml - one identity per workload, none with API access and
none with a mounted token (Unit II 2.3.6). Generated with a range loop
instead of three copies.
*/}}
{{- range $component := list "frontend" "backend" "db" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tasktracker.fullname" $ }}-{{ $component }}
  labels:
    {{- include "tasktracker.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
automountServiceAccountToken: false
{{- end }}
