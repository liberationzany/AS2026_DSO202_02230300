{{- /*
tls-secret.yaml - a self-signed certificate for the Ingress host, created
by the chart when ingress.tls.selfSigned is true (Assignment 2 needed a
separate script for this).

As with the DB password, an existing certificate is reused on upgrade
("lookup"); otherwise every "helm upgrade" would issue a new certificate and
browsers would warn again. It is reused ONLY if it was issued for the
current host: the host is recorded in an annotation, because a template
cannot read the certificate's own SAN. Changing ingress.host therefore
issues a new certificate instead of silently serving one for the old name.
genSelfSignedCert takes CN, IPs, DNS names and validity in days.
*/}}
{{- if and .Values.ingress.tls.enabled .Values.ingress.tls.selfSigned }}
{{- $name := include "tasktracker.tlsSecretName" . -}}
{{- $host := .Values.ingress.host -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $crt := "" -}}
{{- $key := "" -}}
{{- $issuedFor := "" -}}
{{- if and $existing $existing.metadata.annotations -}}
{{- $issuedFor = index $existing.metadata.annotations "tasktracker.dso202/certificate-host" | default "" -}}
{{- end -}}
{{- if and $existing $existing.data (eq $issuedFor $host) -}}
{{- $crt = index $existing.data "tls.crt" -}}
{{- $key = index $existing.data "tls.key" -}}
{{- else -}}
{{- $cert := genSelfSignedCert $host nil (list $host) 365 -}}
{{- $crt = $cert.Cert | b64enc -}}
{{- $key = $cert.Key | b64enc -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
  annotations:
    tasktracker.dso202/certificate-host: {{ $host | quote }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
{{- end }}
