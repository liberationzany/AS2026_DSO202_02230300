{{- /*
db.yaml - PostgreSQL: the governing headless Service, the client Service and
the StatefulSet (Unit II 2.1). One replica, for the reason given in
assignment2/manifests/05-statefulset-db.yaml. The data PVC comes from
volumeClaimTemplates and is retained on delete unless db.retainOnDelete is
false. Helm never deletes PVCs created by a StatefulSet on uninstall either:
they are not part of the release.
*/}}
{{- $fullname := include "tasktracker.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-db-headless
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  clusterIP: None
  selector:
    {{- include "tasktracker.selectorLabels" (dict "ctx" . "component" "db") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-db
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  type: ClusterIP
  selector:
    {{- include "tasktracker.selectorLabels" (dict "ctx" . "component" "db") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-db
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  serviceName: {{ $fullname }}-db-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "tasktracker.selectorLabels" (dict "ctx" . "component" "db") | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ ternary "Retain" "Delete" .Values.db.retainOnDelete }}
    whenScaled: Retain
  template:
    metadata:
      labels:
        {{- include "tasktracker.labels" . | nindent 8 }}
        app.kubernetes.io/component: db
      annotations:
        # Credentials changing must restart Postgres' Pod to take effect.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ $fullname }}-db
      automountServiceAccountToken: false
      containers:
        - name: db
          image: {{ include "tasktracker.image" .Values.images.db | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: {{ $fullname }}-config, key: POSTGRES_DB}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ $fullname }}-db-credentials, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $fullname }}-db-credentials, key: POSTGRES_PASSWORD}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "tasktracker.selectorLabels" (dict "ctx" . "component" "db") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.db.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.db.storage.size }}
