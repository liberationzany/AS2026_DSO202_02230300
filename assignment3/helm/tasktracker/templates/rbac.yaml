{{- /*
rbac.yaml - the CD deployer (Unit II 2.3.8) and the developers' read-only
binding (2.3.6), both namespaced. Same rules as Assignment 2's
12-rbac-deployer.yaml; see that file for why each verb is in or out.
*/}}
{{- if .Values.rbac.createDeployer }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tasktracker.fullname" . }}-deployer
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tasktracker.fullname" . }}-deployer
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "controllerrevisions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tasktracker.fullname" . }}-deployer
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tasktracker.fullname" . }}-deployer
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tasktracker.fullname" . }}-deployer
{{- end }}
{{- with .Values.rbac.viewerGroup }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tasktracker.fullname" $ }}-viewers
  labels:
    {{- include "tasktracker.labels" $ | nindent 4 }}
subjects:
  - kind: Group
    name: {{ . }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
{{- end }}
