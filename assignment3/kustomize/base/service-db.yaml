# base/service-db.yaml - from assignment2/manifests/06-service-db.yaml.
# metadata.namespace removed: each overlay sets it with `namespace:`.
# Full design notes are in the Assignment 2 file's header.
apiVersion: v1
kind: Service
metadata:
  name: db-svc
  labels:
    app.kubernetes.io/name: tasktracker
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: tasktracker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tasktracker
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
