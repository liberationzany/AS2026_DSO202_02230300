# base/service-backend.yaml - from assignment2/manifests/08-service-backend.yaml.
# metadata.namespace removed: each overlay sets it with `namespace:`.
# Full design notes are in the Assignment 2 file's header.
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  labels:
    app.kubernetes.io/name: tasktracker
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: tasktracker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tasktracker
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
