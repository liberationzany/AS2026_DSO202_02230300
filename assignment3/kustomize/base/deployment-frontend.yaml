# base/deployment-frontend.yaml - from assignment2/manifests/09-deployment-frontend.yaml.
# metadata.namespace removed: each overlay sets it with `namespace:`.
# Full design notes are in the Assignment 2 file's header.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: tasktracker
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: tasktracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tasktracker
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tasktracker
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: tasktracker
    spec:
      serviceAccountName: frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101                # "nginx" in the image
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: dso202-frontend:1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              valueFrom: {configMapKeyRef: {name: app-config, key: BACKEND_URL}}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
