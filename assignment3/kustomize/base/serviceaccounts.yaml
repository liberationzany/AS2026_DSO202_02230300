# base/serviceaccounts.yaml - from assignment2/manifests/03-serviceaccounts.yaml.
# metadata.namespace removed: each overlay sets it with `namespace:`.
# Full design notes are in the Assignment 2 file's header.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  labels:
    app.kubernetes.io/part-of: tasktracker
    app.kubernetes.io/component: frontend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  labels:
    app.kubernetes.io/part-of: tasktracker
    app.kubernetes.io/component: backend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db
  labels:
    app.kubernetes.io/part-of: tasktracker
    app.kubernetes.io/component: database
automountServiceAccountToken: false
