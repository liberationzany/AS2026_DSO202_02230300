apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/instance: tasktracker-dev
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: tasktracker
    app.kubernetes.io/part-of: tasktracker
    dso202/environment: dev
  name: backend
  namespace: dso202-a3-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      app.kubernetes.io/name: tasktracker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        app.kubernetes.io/name: tasktracker
        app.kubernetes.io/part-of: tasktracker
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              key: DB_HOST
              name: app-config-h29cdc7dhk
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              key: DB_PORT
              name: app-config-h29cdc7dhk
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              key: DB_NAME
              name: app-config-h29cdc7dhk
        - name: APP_PORT
          valueFrom:
            configMapKeyRef:
              key: APP_PORT
              name: app-config-h29cdc7dhk
        - name: CORS_ORIGIN
          valueFrom:
            configMapKeyRef:
              key: CORS_ORIGIN
              name: app-config-h29cdc7dhk
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              key: DB_USER
              name: db-credentials-g54k576c5g
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD
              name: db-credentials-g54k576c5g
        image: dso202-backend:1.1
        imagePullPolicy: Never
        livenessProbe:
          failureThreshold: 3
          periodSeconds: 10
          tcpSocket:
            port: http
        name: backend
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /api/status
            port: http
          periodSeconds: 5
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 60
          periodSeconds: 5
          tcpSocket:
            port: http
      securityContext:
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: backend
---
apiVersion: apps/v1
