  namespace: dso202-a3-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
      app.kubernetes.io/name: tasktracker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
        app.kubernetes.io/name: tasktracker
        app.kubernetes.io/part-of: tasktracker
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: BACKEND_URL
          valueFrom:
            configMapKeyRef:
              key: BACKEND_URL
              name: app-config-h29cdc7dhk
        image: dso202-frontend:1.0
        imagePullPolicy: Never
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        name: frontend
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      securityContext:
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: frontend
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: tasktracker-dev
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: tasktracker
    app.kubernetes.io/part-of: tasktracker
    dso202/environment: dev
  name: db
  namespace: dso202-a3-dev
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: database
      app.kubernetes.io/name: tasktracker
  serviceName: db-headless
  template:
    metadata:
      labels:
        app.kubernetes.io/component: database
        app.kubernetes.io/name: tasktracker
        app.kubernetes.io/part-of: tasktracker
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              key: POSTGRES_DB
              name: app-config-h29cdc7dhk
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER
              name: db-credentials-g54k576c5g
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: db-credentials-g54k576c5g
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: dso202-db:1.0
        imagePullPolicy: Never
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -h 127.0.0.1
          failureThreshold: 6
          initialDelaySeconds: 30
          periodSeconds: 10
        name: db
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          failureThreshold: 3
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
      serviceAccountName: db
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  volumeClaimTemplates:
  - metadata:
      labels:
        app.kubernetes.io/component: database
        app.kubernetes.io/name: tasktracker
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app.kubernetes.io/instance: tasktracker-dev
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: tasktracker
    app.kubernetes.io/part-of: tasktracker
    dso202/environment: dev
  name: tasktracker
  namespace: dso202-a3-dev
spec:
  ingressClassName: nginx
  rules:
  - host: tasktracker-dev.localhost
    http:
      paths:
      - backend:
          service:
            name: backend-svc
            port:
              name: http
        path: /api
        pathType: Prefix
      - backend:
          service:
            name: frontend-svc
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - tasktracker-dev.localhost
    secretName: tasktracker-tls
