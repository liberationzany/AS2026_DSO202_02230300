# Source: tasktracker/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tasktracker-prod
  labels:
    helm.sh/chart: tasktracker-0.1.0
    app.kubernetes.io/name: tasktracker
    app.kubernetes.io/instance: tasktracker-prod
    app.kubernetes.io/version: "1.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: tasktracker
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "tasktracker-helm-prod.localhost"
      secretName: tasktracker-prod-tls
  rules:
    - host: "tasktracker-helm-prod.localhost"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: tasktracker-prod-backend
                port: {name: http}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tasktracker-prod-frontend
                port: {name: http}
---
# Source: tasktracker/templates/tests/test-api.yaml
apiVersion: v1
kind: Pod
metadata:
  name: tasktracker-prod-test-api
  labels:
    helm.sh/chart: tasktracker-0.1.0
    app.kubernetes.io/name: tasktracker
    app.kubernetes.io/instance: tasktracker-prod
    app.kubernetes.io/version: "1.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: tasktracker
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: test
      image: busybox:1.37
      command:
        - sh
        - -ec
        - |
          wget -qO- http://tasktracker-prod-frontend:8080/ | grep -q '<html'
          echo "frontend: page served"
          wget -qO- http://tasktracker-prod-frontend:8080/config.js | grep -F 'https://tasktracker-helm-prod.localhost:8443'
          wget -qO- http://tasktracker-prod-backend:8080/api/status | tee /dev/stderr | grep -q '"db":"connected"'
          echo "backend: database connected"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}

