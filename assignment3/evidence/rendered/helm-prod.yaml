# Source: tasktracker/templates/db.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tasktracker-prod-db
  labels:
    helm.sh/chart: tasktracker-0.1.0
    app.kubernetes.io/name: tasktracker
    app.kubernetes.io/instance: tasktracker-prod
    app.kubernetes.io/version: "1.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: tasktracker
    app.kubernetes.io/component: db
spec:
  serviceName: tasktracker-prod-db-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: tasktracker
      app.kubernetes.io/instance: tasktracker-prod
      app.kubernetes.io/component: db
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        helm.sh/chart: tasktracker-0.1.0
        app.kubernetes.io/name: tasktracker
        app.kubernetes.io/instance: tasktracker-prod
        app.kubernetes.io/version: "1.1"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: tasktracker
        app.kubernetes.io/component: db
      annotations:
        # Credentials changing must restart Postgres' Pod to take effect.
        checksum/secret: f00f60539d830b4cfcbae0fe8f76385a01e2e0129d48d7a191757e20613fa496
    spec:
      serviceAccountName: tasktracker-prod-db
      automountServiceAccountToken: false
      containers:
        - name: db
          image: "dso202-db:1.0"
          imagePullPolicy: Never
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: tasktracker-prod-config, key: POSTGRES_DB}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: tasktracker-prod-db-credentials, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: tasktracker-prod-db-credentials, key: POSTGRES_PASSWORD}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: tasktracker
          app.kubernetes.io/instance: tasktracker-prod
          app.kubernetes.io/component: db
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

