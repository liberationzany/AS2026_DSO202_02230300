# =============================================================================
# File        : manifests/02-secret.yaml
# Apply with  : kubectl apply -f manifests/02-secret.yaml
#
# Carries the credential half of the env var contract (Section 4.2). Same
# duplication pattern as the ConfigMap: DB_USER/DB_PASSWORD (backend) and
# POSTGRES_USER/POSTGRES_PASSWORD (official postgres image) must carry equal
# values under different key names.
#
# 'stringData' is used instead of 'data' so the values are written in plain
# text here and base64-encoded by the API server on apply -- kubectl get
# still returns them base64-encoded either way. A classroom-only credential,
# not a real one; a production cluster would source this from a vault/CSI
# driver rather than a committed manifest.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: dso202-assignment-1
  labels:
    dso202/assignment: "1"
    dso202/managed-by: declarative
type: Opaque
stringData:
  # --- consumed by the backend Deployment ---
  DB_USER: taskuser
  DB_PASSWORD: taskpass

  # --- consumed by the db Deployment (official postgres image) ---
  POSTGRES_USER: taskuser        # must equal DB_USER above
  POSTGRES_PASSWORD: taskpass    # must equal DB_PASSWORD above
