# =============================================================================
# File       : gitops/manifests/service.yaml
# Practical  : DSO202 Practical 4 - GitOps with Argo CD
# Purpose    : Stable in-cluster address for the webapp Pods.
#              Experiment 3 DELETES this file from Git to show that, with
#              'prune: true', Argo CD deletes the Service from the cluster;
#              'git revert' then brings it back.
# Synced by  : argocd/argocd-app.yaml (Application 'my-webapp')
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: webapp-svc
  labels:
    app: webapp
    dso202/practical: "04"
    dso202/managed-by: argocd
spec:
  # ClusterIP: reachable only inside the cluster. Nothing outside needs it in
  # this lab; the client checks run from a temporary Pod.
  type: ClusterIP
  selector:
    app: webapp
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
