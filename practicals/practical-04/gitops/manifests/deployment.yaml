# =============================================================================
# File       : gitops/manifests/deployment.yaml
# Practical  : DSO202 Practical 4 - GitOps with Argo CD
# Purpose    : DESIRED STATE for the demo web app. Argo CD reads this file
#              from GitHub and makes the cluster match it. Nobody runs
#              'kubectl apply' on it by hand: changing replicas means editing
#              this file, committing, and pushing.
# Synced by  : argocd/argocd-app.yaml (Application 'my-webapp')
# Target ns  : demo-app (set by the Application's destination, so no
#              'namespace:' field is written here)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deploy
  labels:
    app: webapp
    dso202/practical: "04"
    dso202/managed-by: argocd
spec:
  # Experiment 1 changes this value in Git (2 -> 4). Experiment 2 changes it in
  # the cluster with 'kubectl scale' and Argo CD's self-heal puts it back.
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
        dso202/practical: "04"
    spec:
      containers:
        - name: webapp
          # A tiny nginx image that answers with its own hostname and address,
          # so each response shows which Pod served it.
          image: nginxdemos/hello:plain-text
          ports:
            - name: http
              containerPort: 80
          # Readiness drives Argo CD's health status: the Deployment is only
          # reported Healthy once every replica passes this probe.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
