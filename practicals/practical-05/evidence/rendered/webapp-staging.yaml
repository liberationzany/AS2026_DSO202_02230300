apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/environment: staging
  name: webapp-staging
---
apiVersion: v1
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <body>
    <h1>STAGING</h1>
    <p>Environment: staging. Release candidate, two replicas.</p>
    </body>
    </html>
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/environment: staging
  name: web-content-k4c25662dk
  namespace: webapp-staging
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/environment: staging
    app.kubernetes.io/name: webapp
  name: webapp
  namespace: webapp-staging
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: webapp
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/environment: staging
    app.kubernetes.io/name: webapp
  name: webapp
  namespace: webapp-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
  template:
    metadata:
      labels:
        app.kubernetes.io/environment: staging
        app.kubernetes.io/name: webapp
    spec:
      containers:
      - image: nginx:1.31-alpine
        name: webapp
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: web-content
          readOnly: true
      volumes:
      - configMap:
          name: web-content-k4c25662dk
        name: web-content
