apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/environment: prod
  name: webapp-prod
---
apiVersion: v1
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <body>
    <h1>PRODUCTION</h1>
    <p>Environment: prod. Pinned release, four replicas, raised resources.</p>
    </body>
    </html>
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/environment: prod
  name: web-content-9dkcdmkmf8
  namespace: webapp-prod
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/environment: prod
    app.kubernetes.io/name: webapp
  name: webapp
  namespace: webapp-prod
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: webapp
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/environment: prod
    app.kubernetes.io/name: webapp
  name: webapp
  namespace: webapp-prod
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
  template:
    metadata:
      labels:
        app.kubernetes.io/environment: prod
        app.kubernetes.io/name: webapp
    spec:
      containers:
      - image: nginx:1.30-alpine
        name: webapp
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: web-content
          readOnly: true
      volumes:
      - configMap:
          name: web-content-9dkcdmkmf8
        name: web-content
