# 01-csr-saroj.yaml - asks the cluster CA (through kube-controller-manager's
# csrsigning controller) to sign saroj.csr as a client certificate.
# spec.request is the base64 of the PEM CSR from Step 2. A CSR only holds the
# public key and the subject, so it is safe to keep in Git. The private key
# (saroj.key) stays in ~/k8s-users and is never committed.
apiVersion: certificates.k8s.io/v1
kind: CertificateSigningRequest
metadata:
  name: saroj
spec:
  request: 
  # The only built-in signer whose certificates the API server accepts for
  # client authentication.
  signerName: kubernetes.io/kube-apiserver-client
  # 90 days; the controller-manager caps it at --cluster-signing-duration.
  expirationSeconds: 7776000
  # Must be exactly "client auth" for this signer.
  usages:
    - client auth
