# 06-serviceaccount-ci-bot.yaml - (extension) the alternative the notes
# recommend for shared clusters: a ServiceAccount is a real API object, so
# deleting it revokes every token issued for it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-bot
  namespace: dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-bot-pod-manager
  namespace: dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-manager
subjects:
  - kind: ServiceAccount
    name: ci-bot
    namespace: dev
